<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>震動測試器</title>
<style>
  :root {
    --bg: #0d0f14;
    --card: #161a23;
    --border: #262b38;
    --text: #f2f3f5;
    --sub: #9aa0ac;
    --accent: #4d8dff;
    --danger: #ff5959;
    --ok: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    padding-bottom: 40px;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 4px 0 16px;
    text-align: center;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .big-value {
    text-align: center;
    padding: 20px 0 8px;
  }
  .big-value .num {
    font-size: 56px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: color 0.15s;
  }
  .big-value .unit {
    font-size: 14px;
    color: var(--sub);
    margin-top: 2px;
  }
  .bar-wrap {
    width: 100%;
    height: 22px;
    background: #1e2330;
    border-radius: 11px;
    overflow: hidden;
    position: relative;
    margin-top: 12px;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3ecf8e, #ffcb3d, #ff5959);
    transition: width 0.06s linear;
    border-radius: 11px;
  }
  .threshold-marker {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: #fff;
    opacity: 0.85;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }
  .row label {
    font-size: 14px;
    color: var(--sub);
    flex-shrink: 0;
  }
  .row .val {
    font-size: 14px;
    font-weight: 600;
    min-width: 46px;
    text-align: right;
  }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: #2a2f3d;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff2;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat {
    background: #1a1f2b;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .stat .label {
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 4px;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    margin-top: 6px;
  }
  button.secondary {
    background: #232838;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:active { opacity: 0.8; }
  .status {
    text-align: center;
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 10px;
    min-height: 18px;
  }
  .log {
    max-height: 180px;
    overflow-y: auto;
    font-size: 13px;
  }
  .log-item {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    color: var(--sub);
  }
  .log-item:last-child { border-bottom: none; }
  .log-item .lv { color: var(--danger); font-weight: 600; }
  .log-empty {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    padding: 16px 0;
  }
  canvas {
    width: 100%;
    height: 90px;
    display: block;
    border-radius: 10px;
    background: #1a1f2b;
  }
</style>
</head>
<body>

<h1>震動測試器</h1>

<div id="permissionCard" class="card" style="display:none;">
  <div class="status">需要授權才能讀取動作感測器</div>
  <button id="permBtn">允許存取動作感測器</button>
</div>

<div class="card">
  <div class="status" id="statusText">準備中…</div>
  <div class="big-value">
    <div class="num" id="curVal">0.00</div>
    <div class="unit">g（相對於重力加速度）</div>
  </div>
  <div class="bar-wrap">
    <div class="bar-fill" id="barFill"></div>
    <div class="threshold-marker" id="thMarker"></div>
  </div>
</div>

<div class="card">
  <div class="row">
    <label>靈敏度上限</label>
    <span class="val" id="maxScaleVal">2.0g</span>
  </div>
  <input type="range" id="maxScale" min="0.2" max="5" step="0.1" value="2.0">

  <div class="row">
    <label>忽略閾值（過濾小震動）</label>
    <span class="val" id="threshVal">0.05g</span>
  </div>
  <input type="range" id="thresh" min="0" max="1.5" step="0.01" value="0.05">
</div>

<div class="card">
  <div class="stats">
    <div class="stat">
      <div class="label">目前最大值</div>
      <div class="value" id="peakVal">0.00</div>
    </div>
    <div class="stat">
      <div class="label">超過閾值次數</div>
      <div class="value" id="eventCount">0</div>
    </div>
  </div>
  <button class="secondary" id="resetBtn">重設最大值 / 紀錄</button>
</div>

<div class="card">
  <div class="status" style="margin-bottom:6px;">近期波形（g）</div>
  <canvas id="waveCanvas"></canvas>
</div>

<div class="card">
  <div class="status" style="margin-bottom:6px;">事件紀錄（超過閾值）</div>
  <div class="log" id="logList">
    <div class="log-empty">尚無紀錄</div>
  </div>
</div>

<script>
(function () {
  const curVal = document.getElementById('curVal');
  const barFill = document.getElementById('barFill');
  const thMarker = document.getElementById('thMarker');
  const statusText = document.getElementById('statusText');
  const maxScale = document.getElementById('maxScale');
  const maxScaleVal = document.getElementById('maxScaleVal');
  const thresh = document.getElementById('thresh');
  const threshVal = document.getElementById('threshVal');
  const peakVal = document.getElementById('peakVal');
  const eventCount = document.getElementById('eventCount');
  const resetBtn = document.getElementById('resetBtn');
  const logList = document.getElementById('logList');
  const permissionCard = document.getElementById('permissionCard');
  const permBtn = document.getElementById('permBtn');
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');

  let peak = 0;
  let events = 0;
  let logs = [];
  let history = [];
  const HISTORY_LEN = 150;
  let lastGravity = { x: 0, y: 0, z: 0 };
  let started = false;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function updateScaleLabel() {
    maxScaleVal.textContent = parseFloat(maxScale.value).toFixed(1) + 'g';
  }
  function updateThreshLabel() {
    threshVal.textContent = parseFloat(thresh.value).toFixed(2) + 'g';
    const pct = Math.min(100, (parseFloat(thresh.value) / parseFloat(maxScale.value)) * 100);
    thMarker.style.left = pct + '%';
  }
  maxScale.addEventListener('input', () => { updateScaleLabel(); updateThreshLabel(); });
  thresh.addEventListener('input', updateThreshLabel);
  updateScaleLabel();
  updateThreshLabel();

  resetBtn.addEventListener('click', () => {
    peak = 0;
    events = 0;
    logs = [];
    peakVal.textContent = '0.00';
    eventCount.textContent = '0';
    renderLog();
  });

  function renderLog() {
    if (logs.length === 0) {
      logList.innerHTML = '<div class="log-empty">尚無紀錄</div>';
      return;
    }
    logList.innerHTML = logs.slice(0, 20).map(l =>
      '<div class="log-item"><span>' + l.time + '</span><span class="lv">' + l.val.toFixed(2) + ' g</span></div>'
    ).join('');
  }

  function drawWave() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    if (history.length < 2) return;
    const scale = parseFloat(maxScale.value);
    const thV = parseFloat(thresh.value);

    // threshold line
    const thY = h - (Math.min(thV, scale) / scale) * h;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1 * devicePixelRatio;
    ctx.setLineDash([4 * devicePixelRatio, 4 * devicePixelRatio]);
    ctx.beginPath();
    ctx.moveTo(0, thY);
    ctx.lineTo(w, thY);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = '#4d8dff';
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.beginPath();
    history.forEach((v, i) => {
      const x = (i / (HISTORY_LEN - 1)) * w;
      const y = h - Math.min(v / scale, 1) * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  function handleMotion(event) {
    started = true;
    statusText.textContent = '偵測中';

    let ax, ay, az;
    if (event.accelerationIncludingGravity && event.accelerationIncludingGravity.x !== null) {
      // 用低通濾波估計重力，扣除後得到純震動加速度
      const g = event.accelerationIncludingGravity;
      const alpha = 0.8;
      lastGravity.x = alpha * lastGravity.x + (1 - alpha) * g.x;
      lastGravity.y = alpha * lastGravity.y + (1 - alpha) * g.y;
      lastGravity.z = alpha * lastGravity.z + (1 - alpha) * g.z;
      ax = g.x - lastGravity.x;
      ay = g.y - lastGravity.y;
      az = g.z - lastGravity.z;
    } else if (event.acceleration && event.acceleration.x !== null) {
      ax = event.acceleration.x;
      ay = event.acceleration.y;
      az = event.acceleration.z;
    } else {
      statusText.textContent = '此裝置不支援動作感測器';
      return;
    }

    const mag = Math.sqrt(ax * ax + ay * ay + az * az) / 9.81; // 轉換為 g

    const scale = parseFloat(maxScale.value);
    const th = parseFloat(thresh.value);

    curVal.textContent = mag.toFixed(2);
    const pct = Math.min(100, (mag / scale) * 100);
    barFill.style.width = pct + '%';

    if (mag >= th) {
      curVal.style.color = mag > scale * 0.75 ? 'var(--danger)' : 'var(--text)';
      if (mag > peak) {
        peak = mag;
        peakVal.textContent = peak.toFixed(2);
      }
      events += 1;
      eventCount.textContent = events;
      const now = new Date();
      const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
      logs.unshift({ time: timeStr, val: mag });
      if (logs.length > 50) logs.pop();
      renderLog();
    } else {
      curVal.style.color = 'var(--sub)';
    }

    history.push(mag);
    if (history.length > HISTORY_LEN) history.shift();
    drawWave();
  }

  function startListening() {
    window.addEventListener('devicemotion', handleMotion);
    setTimeout(() => {
      if (!started) {
        statusText.textContent = '未偵測到感測器資料，請確認裝置支援並已開啟權限';
      }
    }, 2500);
  }

  function init() {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      // iOS 13+ 需要使用者手動授權
      permissionCard.style.display = 'block';
      statusText.textContent = '等待授權';
      permBtn.addEventListener('click', () => {
        DeviceMotionEvent.requestPermission().then(res => {
          if (res === 'granted') {
            permissionCard.style.display = 'none';
            startListening();
          } else {
            statusText.textContent = '權限被拒絕，無法讀取感測器';
          }
        }).catch(() => {
          statusText.textContent = '授權時發生錯誤';
        });
      });
    } else if ('DeviceMotionEvent' in window) {
      startListening();
    } else {
      statusText.textContent = '此瀏覽器不支援動作感測器';
    }
  }

  init();
})();
</script>

</body>
</html>
